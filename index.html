<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tatuaże</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <!-- Blok banera / nagłówek 1 -->
    <header class="banner">
        <img src="logo.jpg" alt="salon">
    </header>

    <!-- Blok nagłówkowy 2 -->
    <header class="main-header">
        <h1>Studio Tatuażu</h1>
    </header>

    <!-- Kontener główny (układ dwukolumnowy lub blokowy wg arkusza) -->
    <div class="container">
        
        <!-- Sekcja lewa / menu lub nawigacja -->
        <nav class="left-menu">
            <h2>Menu</h2>
            <ul>
                <li><a href="index.html">Strona główna</a></li>
                <li><a href="#oferta">Oferta</a></li>
                <li><a href="#kontakt">Kontakt</a></li>
            </ul>
        </nav>

        <!-- Sekcja główna -->
        <main class="content-section">
            <section id="oferta">
                <h2>Wybierz wzór tatuażu</h2>
                <p>Oferujemy szeroki wybór wzorów w różnych stylach: tradycyjnym, realistycznym, akwareli oraz plemiennym.</p>
                
                <!-- Przykładowe elementy galerii lub formularza wymaganego w zadaniu -->
                <div class="gallery">
                    <div class="tatoo-item">
                        <img src="waz.png" alt="Wąż">
                        <p>Styl: Tradycyjny</p>
                    </div>
                    <div class="tatoo-item">
                        <img src="tygrys.png" alt="Tygrys">
                        <p>Styl: Realistyczny</p>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <!-- Stopka -->
    <footer class="footer">
        <p>Stounek wykonany przez: [Twój Numer Zdającego / PESEL]</p>
    </footer>

    <script src="script.js"></script>
